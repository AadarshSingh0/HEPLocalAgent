[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hep-local-agent"
version = "0.1.1"
description = "A validated local agent for HEP simulation workflows"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3"
]

[project.optional-dependencies]
web = [
    "streamlit>=1.54,<2"
]

[project.scripts]
hep-local-agent = "hep_agent.ui.cli:main"
hep-local-agent-web = "hep_agent.ui.web_launcher:main"
hep-local-agent-doctor = "hep_agent.doctor.cli:main"
hep-local-agent-selftest = "hep_agent.selftest:main"
[tool.setuptools.packages.find]
where = ["src"]
